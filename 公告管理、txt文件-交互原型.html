    function openDirectoryModal(mode){const directory=currentDirectory();if(mode==='rename'&&!directory)return toast('请先选择报表目录',true);state.directoryModalMode=mode;const mask=document.getElementById('reportModalMask');mask.innerHTML=`<section class="modal directory-modal" role="dialog"><div class="modal-head"><h3>${mode==='create'?'新建报表目录':'修改目录名称'}</h3><button class="close-btn" data-report-modal-close>×</button></div><div class="modal-body"><div class="modal-form"><div class="label"><em>*</em>目录名称</div><input id="reportDirectoryName" class="field" maxlength="40" value="${mode==='rename'?escapeHtml(directory.name):''}" placeholder="例如：存贷款规模日报"><div class="modal-hint">新目录将创建在“全部”目录下，用于归集各机构 TXT 文件</div><div id="reportDirectoryError" class="error-text"></div></div></div><div class="modal-foot"><button class="btn" data-report-modal-close>取消</button><button class="btn primary" data-report-modal-confirm>${mode==='create'?'确认创建':'保存修改'}</button></div></section>`;mask.classList.add('open');mask.querySelectorAll('[data-report-modal-close]').forEach(button=>button.addEventListener('click',closeDirectoryModal));mask.querySelector('[data-report-modal-confirm]').addEventListener('click',saveDirectoryModal);const input=mask.querySelector('#reportDirectoryName');input.addEventListener('keydown',event=>{if(event.key==='Enter')saveDirectoryModal()});setTimeout(()=>input.focus(),60)}

    async function saveImportTxtModal(){const nameInput=document.getElementById('reportImportName'),directorySelect=document.getElementById('reportImportDirectory'),error=document.getElementById('reportImportError'),confirm=document.getElementById('reportImportConfirm'),sourceFile=state.pendingTxtFile;if(!nameInput||!directorySelect)return;const displayName=nameInput.value.trim().replace(/\.txt$/i,''),directoryId=Number(directorySelect.value),directory=reportDirectories.find(item=>item.id===directoryId);if(!displayName){error.textContent='请输入名称';return}if(!directory){error.textContent='请选择所属目录';return}if(!sourceFile||!sourceFile.name.toLowerCase().endsWith('.txt')){error.textContent='请上传 TXT 文件';return}const fileName=`${displayName}.txt`,duplicate=directory.files.some(item=>item.name===fileName);if(duplicate&&!state.pendingTxtReplace){state.pendingTxtReplace=true;error.textContent=`“${fileName}”已存在，再次点击将替换原文件`;confirm.textContent='确认替换并导入';return}confirm.disabled=true;confirm.textContent='正在导入...';const content=await sourceFile.text(),incoming={name:fileName,content,size:sourceFile.size||content.length*2,updatedAt:nowText(),institution:displayName};state.selectedDirectoryId=directoryId;state.selectedFileName=null;state.expandedReportIds.add(directoryId);closeDirectoryModal();commitImportedTxt([incoming],duplicate)}

    function handleAction(action,id){if(action==='new')return openEditor();if(action==='preview')return openPreview(id);if(action==='edit')return openEditor(id);if(action==='publish')return openConfirm('发布公告','发布后将在资源目录的公告页签中展示，确认发布该公告吗？',()=>changeStatus(id,'publish'));if(action==='offline')return openConfirm('下线公告','下线后该公告将立即从资源目录中隐藏，确认下线吗？',()=>changeStatus(id,'offline'));if(action==='delete')return openConfirm('删除公告','删除后无法恢复。已发布公告需先下线后才能删除。',()=>deleteAnnouncement(id));if(action==='reset-management'){state.managementKeyword='';state.status='全部状态';renderApp()}if(action==='reset-resource'){state.resourceKeyword='';state.fileType='全部附件';renderApp()}}
    function openEditor(id){const item=id?announcements.find(a=>a.id===id):null;state.editingId=id||null;state.editorFiles=item?[...item.files]:[];const mask=document.getElementById('drawerMask');mask.innerHTML=`<section class="drawer" role="dialog"><div class="drawer-head"><div><h2>${item?'编辑公告':'新建公告'}</h2><p>${item?'更新公告内容与附件信息':'填写公告信息，保存后可直接发布'}</p></div><button class="close-btn" data-close="drawer">×</button></div><div class="drawer-body"><div class="form-grid"><div class="form-item full"><div class="label"><em>*</em>公告标题</div><input id="editorTitle" class="field" maxlength="50" value="${item?item.title:''}" placeholder="请输入公告标题"><span class="count"><span id="titleCount">${item?item.title.length:0}</span>/50</span></div><div class="form-item full"><div class="label"><em>*</em>发布部门</div><select id="editorDepartment" class="field">${departmentOptions(item?item.department:'')}</select></div><div class="form-item full"><div class="label">公告摘要</div><textarea id="editorSummary" class="textarea" maxlength="120" placeholder="简要说明公告内容，便于用户快速了解">${item?item.summary:''}</textarea><span class="count"><span id="summaryCount">${item?item.summary.length:0}</span>/120</span></div><div class="form-item full"><div class="label"><em>*</em>公告正文</div><div class="editor"><div class="editor-toolbar"><button class="tool-btn" data-format="bold">B</button><button class="tool-btn" data-format="italic"><i>I</i></button><button class="tool-btn" data-format="insertUnorderedList">☷</button><span class="tool-sep"></span><button class="tool-btn" data-format="createLink">⌁</button><button class="tool-btn" id="insertImage" title="插入图片">▧</button></div><div id="editorContent" class="editor-area" contenteditable="true" data-placeholder="请输入公告正文，可插入文字与图片">${item?item.content:''}</div></div><div id="formError" class="error-text"></div></div><div class="form-item full"><div class="label">公告附件</div><div class="upload-zone"><input id="attachmentInput" type="file" multiple accept=".doc,.docx,.pdf,.xls,
