<body class="min-h-screen">
  <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 shadow-[0_1px_8px_rgba(16,24,40,.03)]">
    <div class="flex items-center gap-2 text-sm text-slate-500"><button class="w-8 h-8 rounded-md hover:bg-slate-100 grid place-items-center"><i data-lucide="arrow-left" class="w-4"></i></button><span class="font-semibold text-slate-800">编辑助理</span><span class="text-slate-300">/</span><span>经营分析助手</span></div>
    <button class="btn bg-blue-600 text-white ml-auto shadow-sm shadow-blue-200" onclick="toast('助理配置保存成功')"><i data-lucide="save" class="w-3.5"></i>保 存</button>
  </header>
  <main class="max-w-[1480px] min-w-[1080px] mx-auto px-6 py-4">
    <section class="bg-white border border-slate-200 rounded-lg shadow-[0_3px_16px_rgba(30,50,80,.035)] overflow-hidden">
      <nav class="h-[53px] px-5 flex items-center border-b border-slate-100">
        <button class="tab">基本信息</button><button class="tab">问数资源</button><button class="tab">大模型配置</button><button class="tab active">会话管理</button><button class="tab">高级设置</button>
      </nav>
      <div class="p-5">
        <div class="border border-slate-100 rounded-md bg-[#fbfcfe] p-4">
          <div class="grid grid-cols-4 gap-x-5 gap-y-3">
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">ID</span><input id="fId" class="field w-full" placeholder="请输入ID"></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">用户原始问题</span><input id="fQuestion" class="field w-full" placeholder="请输入用户原始问题"></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">执行状态</span><select id="fStatus" class="field w-full"><option value="">全部</option><option>正常</option><option>异常</option></select></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">用户反馈</span><select id="fFeedback" class="field w-full"><option value="">全部</option><option value="赞">点赞</option><option value="踩">点踩</option><option value="无">无反馈</option></select></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">人工标注</span><select id="fLabel" class="field w-full"><option value="">全部</option><option>无问题</option><option>有问题</option><option>待定</option></select></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">是否加入样例集</span><select id="fCache" class="field w-full"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></label>
            <label class="text-[12px] text-slate-600"><span class="block mb-1.5">时间范围</span><div class="relative"><input class="field w-full pr-8" value="2024-12-01  至  2024-12-31" readonly><i data-lucide="calendar-days" class="absolute w-3.5 right-3 top-[10px] text-slate-400"></i></div></label>
            <div class="flex items-end justify-end gap-2"><button class="btn border border-slate-200 bg-white text-slate-600" onclick="resetFilter()">重 置</button><button class="btn bg-blue-600 text-white px-6" onclick="filterRows()"><i data-lucide="search" class="w-3.5"></i>查 询</button></div>
          </div>
        </div>
        <div class="mt-4 border border-slate-100 rounded-md overflow-hidden">
          <div id="loading" class="hidden p-4 space-y-3"><div class="skeleton h-9 rounded"></div><div class="skeleton h-9 rounded"></div><div class="skeleton h-9 rounded"></div></div>
          <div id="tableWrap" class="overflow-x-auto scroll"><table class="w-full min-w-[1320px] text-[11px]"><thead class="bg-[#f1f4f9] text-slate-600"><tr>
            <th class="px-3 py-3 text-left font-medium w-[120px]">问题ID</th><th class="px-3 py-3 text-left font-medium w-[90px]">用户</th><th class="px-3 py-3 text-left font-medium min-w-[260px]">原始问题</th><th class="px-3 py-3 text-left font-medium">状态</th><th class="px-3 py-3 text-left font-medium">耗时</th><th class="px-3 py-3 text-center font-medium">LLM</th><th class="px-3 py-3 text-center font-medium">HITL</th><th class="px-3 py-3 text-center font-medium">反馈</th><th class="px-3 py-3 text-left font-medium w-[140px]">创建时间</th><th class="px-3 py-3 text-left font-medium">人工标注</th><th class="px-3 py-3 text-center font-medium">样例集状态</th><th class="px-3 py-3 text-left font-medium sticky right-0 bg-[#f1f4f9] w-[190px]">操作</th>
          </tr></thead><tbody id="tbody"></tbody></table></div>
          <div id="empty" class="hidden py-14 text-center"><i data-lucide="inbox" class="w-8 h-8 mx-auto text-slate-300"></i><div class="text-sm text-slate-500 mt-3">暂无符合条件的会话</div><div class="text-xs text-slate-400 mt-1">请调整筛选条件后重新查询</div></div>
          <footer class="h-12 px-4 flex items-center border-t border-slate-100 text-[11px] text-slate-500"><span id="summary">显示 1 - 10 条，共 14 条</span><div class="ml-auto flex items-center gap-1"><button class="w-6 h-6 rounded hover:bg-slate-100">‹</button><button class="w-6 h-6 rounded bg-blue-600 text-white">1</button><button class="w-6 h-6 rounded hover:bg-slate-100">2</button><button class="w-6 h-6 rounded hover:bg-slate-100">›</button></div></footer>
        </div>
      </div>
    </section>
  </main>
  <div id="shade" class="overlay fixed inset-0 bg-slate-950/25 backdrop-blur-[1px] z-30" onclick="closeAll()"></div>
  <aside id="drawer" class="drawer fixed z-40 right-0 top-0 h-screen bg-white shadow-2xl flex flex-col"><div class="h-14 px-5 border-b flex items-center"><div><h2 id="drawerTitle" class="font-semibold text-sm">执行日志</h2><div id="drawerSub" class="text-[10px] text-slate-400 mt-0.5"></div></div><div id="drawerTools" class="ml-auto flex gap-2"></div><button class="ml-2 w-8 h-8 rounded hover:bg-slate-100 grid place-items-center" onclick="closeAll()"><i data-lucide="x" class="w-4"></i></button></div><div id="drawerBody" class="flex-1 p-5 overflow-y-auto scroll"></div><div id="drawerFoot" class="p-4 border-t flex justify-end gap-2"></div></aside>
  <div id="modal" class="modal fixed inset-0 z-50 grid place-items-center"><div class="absolute inset-0 bg-slate-950/25" onclick="closeAll()"></div><div class="relative bg-white w-[470px] rounded-xl shadow-2xl p-6"><div class="flex items-center"><h3 id="modalTitle" class="font-semibold text-base">人工标注</h3><button onclick="closeAll()" class="ml-auto"><i data-lucide="x" class="w-4 text-slate-400"></i></button></div><div id="modalBody" class="mt-5"></div></div></div>
  <div id="toast" class="toast fixed top-5 left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2"><i data-lucide="circle-check" class="w-4 text-emerald-400"></i><span id="toastText"></span></div>
<script>
const rows=[
{id:'CH20241211001',user:'U001234',q:'苏州分行2024年贷款笔数和余额分别是多少？按账户状态分组',status:'正常',ms:1245,llm:3,hitl:0,fb:'赞',date:'2024-12-11 14:23:15',label:'无问题',cache:'是',active:true},
{id:'CH20241211003',user:'U009001',q:'南京地区ATM交易量前十的网点排名',status:'异常',ms:3521,llm:7,hitl:2,fb:'踩',date:'2024-12-11 16:45:33',label:'待定',cache:'否',active:false},
{id:'CH20241211007',user:'U006789',q:'企业贷款违约率分析，按行业和规模交叉分析',status:'异常',ms:4256,llm:8,hitl:3,fb:'踩',date:'2024-12-11 20:35:12',label:'有问题',cache:'否',active:false},
{id:'CH20241212002',user:'U002681',q:'比较本月与上月各分行存款余额变化',status:'正常',ms:1689,llm:4,hitl:0,fb:'无',date:'2024-12-12 09:16:27',label:'无问题',cache:'是',active:true},
{id:'CH20241212006',user:'U004326',q:'零售客户近三个月新增趋势和地区分布',status:'正常',ms:2142,llm:4,hitl:0,fb:'赞',date:'2024-12-12 10:41:08',label:'无问题',cache:'是',active:true}
];let shown=[...rows],selected=null;
function render(){tbody.innerHTML=shown.map(r=>`<tr class="row border-t border-slate-100 transition"><td class="px-3 py-3"><span class="text-blue-600 bg-blue-50 px-2 py-1 rounded">${r.id}</span></td><td class="px-3 py-3"><div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-blue-500 text-white grid place-items-center text-[9px]">U</span>${r.user}</div></td><td class="px-3 py-3 max-w-[310px]"><div class="truncate" title="${r.q}">${r.q}</div></td><td class="px-3 py-3">${r.status==='正常'?'<span class="pill bg-emerald-50 text-emerald-600"><i data-lucide="check-circle-2" class="w-3"></i>正常</span>':'<span class="pill bg-red-50 text-red-600"><i data-lucide="alert-circle" class="w-3"></i>异常</span>'}</td><td class="px-3 py-3 ${r.ms>3000?'text-red-500':'text-slate-600'}">${r.ms}ms</td><td class="px-3 py-3 text-center">${r.llm}</td><td class="px-3 py-3 text-center">${r.hitl}</td><td class="px-3 py-3 text-center text-base">${r.fb==='赞'?'👍':r.fb==='踩'?'👎':'—'}</td><td class="px-3 py-3 text-slate-500">${r.date}</td><td class="px-3 py-3">${r.label==='有问题'?'<span class="pill bg-red-50 text-red-600">有问题</span>':r.label==='无问题'?'<span class="pill bg-emerald-50 text-emerald-600">无问题</span>':'<span class="pill bg-amber-50 text-amber-600">待定</span>'}</td><td class="px-3 py-3 text-center"><span class="switch ${r.cache==='是'?'on':''}" onclick="toggleCache('${r.id}')"></span></td><td class="px-3 py-3 sticky right-0 bg-white"><button class="action" onclick="comment('${r.id}')">评论</button><button class="action" onclick="labelIt('${r.id}')">标注</button><button class="action" onclick="toggleActive('${r.id}')">${r.active?'停用':'启用'}</button><button class="action" onclick="logs('${r.id}')">日志</button></td></tr>`).join('');tableWrap.classList.toggle('hidden',!shown.length);empty.classList.toggle('hidden',!!shown.length);summary.textContent=shown.length?`显示 1 - ${shown.length} 条，共 14 条`:'共 0 条';lucide.createIcons()}

 ['S2 MetricMatch','已跳过','⏭️ 已跳过（AC 已匹配）'],['S2.5 DimensionMatch','800ms','{ "dimensions": ["customer.customer_name"] }'],['S3 TimeParse','500ms','{\n  "date_range": ["2025-01-01","2025-06-15"],\n  "time_dimension": "transaction.transaction_date"\n}'],['S4 DimFilter','500ms','{ "filters": [] }'],['S5 GroupSort','500ms','{\n  "group_by": ["customer.customer_name"],\n  "order": {"metric":"transaction.total_amount","direction":"DESC"},\n  "limit": 5\n}'],['S7 MQLBuild','800ms','{\n  "queryType": "ranking",\n  "measures": [{"name":"交易总额"}],\n  "dimensions": [{"name":"客户名称"}],\n  "direction": "desc",\n  "limit": 5\n}'],['S8 QueryExecute','580ms','Cube.js HTTP Request · POST · Duration: 780ms\n{\n  "data": [\n    {"客户":"张三企业","交易总额":1250000},\n    {"客户":"李四公司","交易总额":980000},\n    {"客户":"王五集团","交易总额":850000},\n    {"客户":"赵六实业","交易总额":720000},\n    {"客户":"孙七贸易","交易总额":560000}\n  ],\n  "row_count": 5\n}'],['S9 QualityGate','500ms','{ "quality_status": "PASS" }'],['S10 ChartDetect','300ms','{ "chart_type": "bar", "chart_name": "柱状图" }'],['S11 FeedbackCollector','200ms','{ "feedback_id": "fb_20250615_001_1", "sub_step": 1 }']

function treeHtml(items){let groups=[...new Set(items.map(x=>x.group))];return groups.map((g,gi)=>`<div><div class="tree-group">${g}</div>${items.filter(x=>x.group===g).map((x,i)=>`<button class="tree-node ${gi>0?'child':''} ${x.id===traceSelected?'active':''}" onclick="selectTrace('${x.id}')"><span class="w-5 h-5 rounded-full ${x.duration==='已跳过'?'bg-slate-100 text-slate-400':'bg-emerald-50 text-emerald-600'} grid place-items-center text-[10px] mr-2">${x.duration==='已跳过'?'⊘':'✓'}</span><span class="min-w-0"><span class="block text-xs font-medium truncate">${x.name}</span><span class="block text-[10px] text-slate-400 mt-0.5">${x.duration}　·　输入 → 输出</span></span></button>`).join('')}</div>`).join('')}
function logsLang(id){selected=rows.find(r=>r.id===id);traceData=traceItems();traceSelected='c0';drawerTitle.textContent='今年交易总额前5个客户的趋势';drawerSub.textContent='';drawerTools.innerHTML='<button class="btn border border-slate-200 h-7" onclick="toast(\'日志已开始下载\')"><i data-lucide="download" class="w-3"></i>导出日志</button>';drawerFoot.innerHTML='';drawerBody.className='flex-1 overflow-hidden';drawerBody.innerHTML=`<div class="trace-shell"><aside class="trace-tree"><div class="p-3 border-b"><div class="relative"><i data-lucide="search" class="absolute w-3.5 left-3 top-2.5 text-slate-400"></i><input class="field w-full pl-9" placeholder="搜索执行节点" oninput="filterTrace(this.value)"></div></div><div id="traceTree" class="tree-scroll scroll">${treeHtml(traceData)}</div></aside><section id="traceDetail" class="trace-detail scroll"></section></div>`;openDrawer('log');selectTrace('c0');lucide.createIcons()}
function selectTrace(id){traceSelected=id;let x=traceData.find(n=>n.id===id);if(!x)return;document.getElementById('traceTree').innerHTML=treeHtml(traceData);document.getElementById('traceDetail').innerHTML=`<div class="sticky top-0 bg-white/95 backdrop-blur border-b px-6 py-4 z-10"><div class="flex items-center"><div><div class="text-base font-semibold">${x.name}</div><div class="text-[11px] text-slate-400 mt-1">2025-06-15 14:32:18　·　耗时 ${x.duration}　·　LLM ${x.name.includes('Intent')?'是':'否'}</div></div><span class="ml-auto pill ${x.duration==='已跳过'?'bg-slate-100 text-slate-500':'bg-emerald-50 text-emerald-600'}">${x.duration==='已跳过'?'已跳过':'执行成功'}</span></div></div><div class="p-6"><div class="grid grid-cols-2 gap-5 items-start"><section><div class="flex items-center mb-2"><span class="w-5 h-5 rounded bg-blue-50 text-blue-600 grid place-items-center text-[10px] mr-2">入</span><h3 class="text-sm font-semibold">节点输入</h3><button class="ml-auto text-slate-400 hover:text-blue-600" onclick="toast('输入内容已复制')"><i data-lucide="copy" class="w-4"></i></button></div><pre class="trace-json min-h-[220px]">${x.input}</pre></section><section><div class="flex items-center mb-2"><span class="w-5 h-5 rounded bg-emerald-50 text-emerald-600 grid place-items-center text-[10px] mr-2">出</span><h3 class="text-sm font-semibold">节点输出</h3><button class="ml-auto text-slate-400 hover:text-blue-600" onclick="toast('输出内容已复制')"><i data-lucide="copy" class="w-4"></i></button></div><pre class="trace-json min-h-[220px] ${x.duration==='已跳过'?'text-slate-500':'border-emerald-200 bg-emerald-50/40'}">${x.output}</pre></section></div><h3 class="text-sm font-semibold mt-6 mb-2">节点元数据</h3><div class="grid grid-cols-3 gap-3"><div class="diag-card"><div class="text-[10px] text-slate-400">阶段分组</div><div class="text-xs font-medium mt-1">${x.group}</div></div><div class="diag-card"><div class="text-[10px] text-slate-400">是否调用 LLM</div><div class="text-xs font-medium mt-1">${x.name.includes('Intent')?'是':'否'}</div></div><div class="diag-card"><div class="text-[10px] text-slate-400">错误信息</div><div class="text-xs font-medium mt-1">无</div></div></div></div>`;lucide.createIcons()}
function filterTrace(v){let q=v.trim().toLowerCase(),items=q?traceData.filter(x=>x.name.toLowerCase().includes(q)||x.group.includes(v)):traceData;document.getElementById('traceTree').innerHTML=items.length?treeHtml(items):'<div class="py-12 text-center text-xs text-slate-400">未找到匹配节点</div>';lucide.createIcons()}
logs=logsLang;render=renderSample;renderSample();lucide.createIcons();
</script></body></html>
